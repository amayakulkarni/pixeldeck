name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk "../dist/PixelDeck-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pixeldeck-apk
          path: dist/*.apk

  agent:
    name: Windows agent
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Format check
        run: cargo fmt --check
      - name: Tests
        run: cargo test
      - name: Build release exe
        run: cargo build --release
      - name: Collect exe
        shell: bash
        run: |
          mkdir -p ../dist
          cp target/release/pixeldeck-agent.exe ../dist/pixeldeck-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pixeldeck-agent
          path: dist/pixeldeck-agent.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/pixeldeck-agent.exe
          generate_release_notes: true
